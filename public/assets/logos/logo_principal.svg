<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
  <defs>
    <!-- Gradiente Ouro Champanhe Nobre / Joalheria -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0DB" />
      <stop offset="25%" stop-color="#E9C56A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#F4D99B" />
    </linearGradient>

    <!-- Gradiente para o Miolo do Girassol -->
    <radialGradient id="sunflowerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#996515" />
      <stop offset="100%" stop-color="#5C3A00" />
    </radialGradient>

    <!-- Gradiente Linha Divisória -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="25%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FBF0DB" stop-opacity="1" />
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <!-- Fundo Noturno Petróleo Nobre -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06131B" />
      <stop offset="50%" stop-color="#0D2737" />
      <stop offset="100%" stop-color="#051017" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    </style>
  </defs>

  <g transform="translate(200, 45)">
    
  <g transform="translate(0, 0)">
    <!-- Aro Delicado de Alta Joalheria -->
    <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldLuxury)" stroke-width="1.6" stroke-dasharray="2 3.5" opacity="0.7"/>
    <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldLuxury)" stroke-width="1" opacity="0.9"/>
    
    <!-- Pontos Cardeais Delicados em Diamante -->
    <polygon points="100,6 102,10 100,14 98,10" fill="url(#goldLuxury)" />
    <polygon points="100,186 102,190 100,194 98,190" fill="url(#goldLuxury)" />
    <polygon points="6,100 10,102 14,100 10,98" fill="url(#goldLuxury)" />
    <polygon points="186,100 190,102 194,100 190,98" fill="url(#goldLuxury)" />

    <!-- ======================================================== -->
    <!-- GIRASSOL ESTILIZADO EM PETALAS DOURADAS RADIANTES (TOPO) -->
    <!-- ======================================================== -->
    <g transform="translate(100, 68)">
      <!-- Miolo Nobre do Girassol com Textura Radial -->
      <circle cx="0" cy="0" r="13" fill="#996515" stroke="url(#goldLuxury)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#FBF0DB" stroke-width="1" stroke-dasharray="1.5 1.5" opacity="0.8"/>
      <circle cx="0" cy="0" r="3.5" fill="#FBF0DB" />

      <!-- Pétalas do Girassol Florindo Radiantes em Ouro -->
      <!-- Pétala Topo -->
      <path d="M0 -14 C-4 -24 -2 -34 0 -38 C2 -34 4 -24 0 -14 Z" fill="url(#goldLuxury)" />
      <!-- Pétala Topo-Direita 1 -->
      <path d="M7 -12 C13 -21 21 -29 25 -31 C23 -26 17 -19 9 -10 Z" fill="url(#goldLuxury)" opacity="0.95"/>
      <!-- Pétala Direita Alta -->
      <path d="M12 -6 C22 -11 32 -13 36 -12 C32 -8 24 -4 14 -1 Z" fill="url(#goldLuxury)" />
      <!-- Pétala Direita -->
      <path d="M13 2 C24 3 34 8 38 12 C33 13 23 11 13 6 Z" fill="url(#goldLuxury)" opacity="0.95"/>
      <!-- Pétala Topo-Esquerda 1 -->
      <path d="M-7 -12 C-13 -21 -21 -29 -25 -31 C-23 -26 -17 -19 -9 -10 Z" fill="url(#goldLuxury)" opacity="0.95"/>
      <!-- Pétala Esquerda Alta -->
      <path d="M-12 -6 C-22 -11 -32 -13 -36 -12 C-32 -8 -24 -4 -14 -1 Z" fill="url(#goldLuxury)" />
      <!-- Pétala Esquerda -->
      <path d="M-13 2 C-24 3 -34 8 -38 12 C-33 13 -23 11 -13 6 Z" fill="url(#goldLuxury)" opacity="0.95"/>

      <!-- Pétalas Secundárias de Camada Interna (Volume Floral) -->
      <path d="M4 -13 C6 -20 11 -26 14 -28 C12 -23 8 -18 3 -12 Z" fill="#FBF0DB" opacity="0.7"/>
      <path d="M-4 -13 C-6 -20 -11 -26 -14 -28 C-12 -23 -8 -18 -3 -12 Z" fill="#FBF0DB" opacity="0.7"/>
      <path d="M10 -4 C18 -7 24 -8 28 -7 C24 -4 18 -2 10 -1 Z" fill="#FBF0DB" opacity="0.7"/>
      <path d="M-10 -4 C-18 -7 -24 -8 -28 -7 C-24 -4 -18 -2 -10 -1 Z" fill="#FBF0DB" opacity="0.7"/>
    </g>

    <!-- ======================================================== -->
    <!-- MONOGRAMA 'J' CALIGRÁFICO EM HARMONIA COM O GIRASSOL      -->
    <!-- ======================================================== -->
    <!-- A haste do J flui organicamente do centro do girassol até a curva graciosa na base -->
    <path d="M96 74 C96 74 98 84 98 100 L98 128 C98 144 88 152 74 152 C60 152 50 142 50 130 C50 120 58 114 66 114 C74 114 78 120 78 127 C78 135 71 139 65 138 C68 144 74 146 82 144 C90 141 91 133 91 125 L91 74 Z"
          fill="url(#goldLuxury)" />

    <!-- Ramo Orgânico Delicado Lateral de Folhas de Girassol -->
    <path d="M105 102 C118 108 132 118 136 132" fill="none" stroke="url(#goldLuxury)" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <!-- Folha da Direita 1 -->
    <path d="M116 106 C124 102 134 103 138 109 C133 113 125 113 118 109 Z" fill="url(#goldLuxury)" opacity="0.85"/>
    <!-- Folha da Direita 2 -->
    <path d="M128 118 C137 117 146 122 148 129 C141 130 134 126 128 120 Z" fill="url(#goldLuxury)" opacity="0.85"/>

    <!-- Ponto Brilhante / Centelha Solar -->
    <g transform="translate(138, 62)">
      <path d="M0 -6 L1.2 -1.8 L5.5 0 L1.2 1.8 L0 6 L-1.2 1.8 L-5.5 0 L-1.2 -1.8 Z" fill="url(#goldLuxury)" />
    </g>
  </g>
  
  </g>
  
  <!-- Tipografia Principal: Nobre, Majestosa e Acolhedora -->
  <text x="300" y="325" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="700" font-size="46" fill="#0C2331" letter-spacing="8">JÉSSICA</text>
  
  <!-- Linha divisória de joalheria com diamante central -->
  <line x1="160" y1="346" x2="440" y2="346" stroke="url(#goldLine)" stroke-width="2" />
  <polygon points="300,342 304,346 300,350 296,346" fill="url(#goldLuxury)" />

  <text x="300" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#B8860B" letter-spacing="8">SECRETARIA REMOTA</text>
  
  <text x="300" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="12" fill="#587485" letter-spacing="4">ORGANIZAÇÃO • ATENDIMENTO • EXCELÊNCIA</text>
</svg>
